<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Retail Analytics Assistant</title>
<style>
  :root { --line: #e2e2e7; --dim: #8a8a94; --ink: #1d1d20; --bg: #fbfbfd; --accent: #2f6feb; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: var(--bg);
         color: var(--ink); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  form { width: min(320px, calc(100vw - 32px)); background: #fff; border: 1px solid var(--line);
         border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 11px; }
  h1 { font-size: 17px; margin: 0; }
  p { margin: 0 0 6px; color: var(--dim); font-size: 13px; }
  input, button { font: inherit; border: 1px solid var(--line); border-radius: 7px; padding: 9px 11px; background: #fff; }
  button { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; margin-top: 4px; }
  button:disabled { opacity: .5; cursor: default; }
  #whoops { color: #b3261e; font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
<form id="signin">
  <h1>Retail Analytics Assistant</h1>
  <p>Sign in to ask questions about the data.</p>
  <input id="who" placeholder="username" autocomplete="username" autofocus>
  <input id="pw" type="password" placeholder="password" autocomplete="current-password">
  <button type="submit">Sign in</button>
  <div id="whoops"></div>
</form>

<script>
const form = document.getElementById("signin"), whoops = document.getElementById("whoops");
form.onsubmit = async (e) => {
  e.preventDefault();
  form.querySelector("button").disabled = true;
  whoops.textContent = "";
  const response = await fetch("/login", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({user: document.getElementById("who").value.trim(),
                          password: document.getElementById("pw").value}),
  });
  if (response.ok) { location.href = "/"; return; }
  whoops.textContent = (await response.json()).detail;
  form.querySelector("button").disabled = false;
  document.getElementById("pw").value = "";
  document.getElementById("pw").focus();
};
</script>
</body>
</html>
